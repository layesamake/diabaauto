name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:validate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/diaba-auto
          DIRECT_URL: postgresql://user:password@localhost:5432/diaba-auto
      - name: Vérifier la couverture des migrations (hors ligne, sans base)
        run: node scripts/verify-migrations.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
